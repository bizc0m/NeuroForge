<svg xmlns="http://www.w3.org/2000/svg" width="{{WIDTH}}" height="22" viewBox="0 0 {{WIDTH}} 22" role="img" aria-labelledby="title desc">
  <title id="title">{{TITLE}}</title>
  <desc id="desc">{{DESCRIPTION}}</desc>
  <rect width="{{WIDTH}}" height="22" fill="#050505"/>
  <rect x="0.5" y="0.5" width="{{BORDER_WIDTH}}" height="21" fill="none" stroke="#f5f5f5"/>
  <rect x="4" y="4" width="{{LEFT_WIDTH}}" height="14" fill="#f5f5f5"/>
  <text x="{{LEFT_TEXT_X}}" y="15" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#050505">{{LEFT_TEXT}}</text>
  <text x="{{RIGHT_TEXT_X}}" y="15" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#f5f5f5">{{RIGHT_TEXT}}</text>
</svg>
