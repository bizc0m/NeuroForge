<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecondSaver</title>
</head>
<body>
  <h1>SecondSaver</h1>
  <p>Example Neuro Forge project page.</p>
  <section id="neuroforge-badges" data-badges-json="../build/neuroforge-badges.json">
    <p>Badge data is generated by <code>scripts/generate-badges.sh</code>.</p>
  </section>
  <script>
    const mount = document.querySelector('#neuroforge-badges');
    fetch(mount.dataset.badgesJson)
      .then((response) => response.ok ? response.json() : null)
      .then((data) => {
        if (!data) return;
        const list = document.createElement('ul');
        data.badges.forEach((badge) => {
          const item = document.createElement('li');
          item.textContent = `${badge.label}: ${badge.markdown}`;
          list.appendChild(item);
        });
        mount.appendChild(list);
      })
      .catch(() => {
        mount.dataset.badgesStatus = 'pending';
      });
  </script>
</body>
</html>
